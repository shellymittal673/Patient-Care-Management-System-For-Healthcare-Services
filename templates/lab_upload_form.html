{% extends "base.html" %}
{% block title %}Upload Lab Result{% endblock %}
{% block content %}
<div class="breadcrumb"><a href="{{ url_for('dashboard.home') }}">Dashboard</a> / <a href="{{ url_for('lab.dashboard') }}">Lab Management</a> / Upload Result</div>
<h2 class="page-title">Upload Test Result</h2>
<p class="page-sub">{{ test.test_type }} — {{ test.patient.full_name }}</p>

<div class="card" style="max-width:600px;">
  <form method="POST" enctype="multipart/form-data">
    <label>Result Summary</label>
    <input type="text" name="result_summary" placeholder="e.g. Normal / Borderline / Abnormal">

    <label>Upload Report (PDF or Image)</label>
    <input type="file" name="report_file" accept=".pdf,.jpg,.jpeg,.png">

    <label>Remarks</label>
    <textarea name="remarks" placeholder="e.g. Sample collected on-site. Report verified."></textarea>

    <button type="submit" class="btn btn-green" style="margin-top:16px;">&#128190; Upload &amp; Save Result</button>
  </form>
</div>
{% endblock %}
