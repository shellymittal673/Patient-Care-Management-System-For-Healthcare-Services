{% extends "base.html" %}
{% block title %}Edit Medical Summary{% endblock %}
{% block content %}
<div class="breadcrumb"><a href="{{ url_for('dashboard.home') }}">Dashboard</a> / <a href="{{ url_for('ehr.view', patient_id=patient.id) }}">EHR</a> / Edit Summary</div>
<h2 class="page-title">Edit Medical Summary — {{ patient.full_name }}</h2>

<div class="card">
  <form method="POST">
    <div class="grid-2">
      <div>
        <label>Height (cm)</label>
        <input type="number" step="0.1" name="height_cm" value="{{ patient.height_cm or '' }}">
      </div>
      <div>
        <label>Weight (kg)</label>
        <input type="number" step="0.1" name="weight_kg" value="{{ patient.weight_kg or '' }}">
      </div>
    </div>
    <div class="grid-2">
      <div>
        <label>Smoking</label>
        <select name="smoking">
          <option value="No" {% if patient.smoking == 'No' %}selected{% endif %}>No</option>
          <option value="Yes" {% if patient.smoking == 'Yes' %}selected{% endif %}>Yes</option>
        </select>
      </div>
      <div>
        <label>Alcohol</label>
        <select name="alcohol">
          <option value="No" {% if patient.alcohol == 'No' %}selected{% endif %}>No</option>
          <option value="Occasional" {% if patient.alcohol == 'Occasional' %}selected{% endif %}>Occasional</option>
          <option value="Regular" {% if patient.alcohol == 'Regular' %}selected{% endif %}>Regular</option>
        </select>
      </div>
    </div>
    <label>Chronic Diseases</label>
    <input type="text" name="chronic_diseases" value="{{ patient.chronic_diseases or '' }}" placeholder="e.g. Diabetes, Hypertension">
    <label>Remarks</label>
    <input type="text" name="remarks" value="{{ patient.remarks or '' }}" placeholder="e.g. Patient is healthy.">

    <button type="submit" class="btn btn-primary" style="margin-top:16px;">Save Summary</button>
  </form>
</div>
{% endblock %}
