{% extends "base.html" %}
{% block title %}{{ 'Edit' if patient else 'Register' }} Patient{% endblock %}
{% block content %}
<div class="breadcrumb"><a href="{{ url_for('dashboard.home') }}">Dashboard</a> / <a href="{{ url_for('patients.list_patients') }}">Patients</a> / {{ 'Edit' if patient else 'Registration Form' }}</div>

<div class="card">
  <div class="card-head"><h3>&#128100; Patient Registration</h3></div>

  <form method="POST">
    <div class="grid-2">
      <div>
        <label>Full Name *</label>
        <input type="text" name="full_name" required value="{{ patient.full_name if patient else '' }}" placeholder="Ravi Kumar">
      </div>
      <div>
        <label>Age *</label>
        <input type="number" name="age" min="0" max="120" value="{{ patient.age if patient else '' }}" placeholder="32">
      </div>
    </div>

    <div class="grid-2">
      <div>
        <label>Gender *</label>
        <select name="gender">
          <option value="Male" {% if patient and patient.gender == 'Male' %}selected{% endif %}>Male</option>
          <option value="Female" {% if patient and patient.gender == 'Female' %}selected{% endif %}>Female</option>
          <option value="Other" {% if patient and patient.gender == 'Other' %}selected{% endif %}>Other</option>
        </select>
      </div>
      <div>
        <label>Blood Group</label>
        <input type="text" name="blood_group" placeholder="O+" value="{{ patient.blood_group if patient else '' }}">
      </div>
    </div>

    <div class="grid-2">
      <div>
        <label>Phone Number *</label>
        <input type="text" name="contact_number" required placeholder="9876543210" value="{{ patient.contact_number if patient else '' }}">
      </div>
      <div>
        <label>Email</label>
        <input type="email" name="email" placeholder="ravi.kumar@example.com" value="{{ patient.email if patient else '' }}">
      </div>
    </div>

    <label>Address *</label>
    <input type="text" name="address" required placeholder="123, MG Road, Bangalore, Karnataka" value="{{ patient.address if patient else '' }}">

    <label>Medical History (Optional)</label>
    <input type="text" name="medical_history" placeholder="No known allergies" value="{{ patient.medical_history if patient else '' }}">

    <div style="margin-top:18px; display:flex; gap:10px;">
      <button type="submit" class="btn btn-primary">{{ 'Update Patient' if patient else 'Register Patient' }}</button>
      <button type="reset" class="btn btn-outline">Reset</button>
    </div>
  </form>
</div>
{% endblock %}
